name: CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check release automation
        run: |
          shellcheck .github/scripts/*.sh
          bash .github/scripts/release_test.sh
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
      - run: test -z "$(gofmt -l .)"
      - run: go test -race ./...
      - run: go vet ./...
      - name: Check standalone dependency boundary
        run: |
          dependencies=$(go list -deps -test ./...)
          if printf '%s\n' "$dependencies" | grep -Eq '^(go\.yorun\.ai/vine|github\.com/yorun-ai/vine)(/|$)'; then
            echo "Standalone client must not depend on Vine" >&2
            exit 1
          fi
    env:
      GOWORK: 'off'
  required:
    name: CI / Required Checks
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success
